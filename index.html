<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#002A5C" />
    <meta name="description" content="Seahawks HQ — next game, season tracker, and roster for Seattle Seahawks fans." />
    <title>Seahawks HQ</title>

    <!-- Google tag (gtag.js) -- same property as CFB HQ/F1 dashboard, per the user's explicit
         confirmation (2026-08-27) that shared-property-with-per-page-breakout is fine here.
         send_page_view is off because this is a client-side-routed SPA: src/utils/analytics.js
         fires the pageview itself on every route change (including the first), so the initial
         auto-pageview would otherwise double-count that first load. Same pattern as CFB_top25's
         index.html. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9K08FK3SWH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-9K08FK3SWH', { send_page_view: false });
    </script>

    <!-- No favicon/apple-touch-icon yet either -- no logo asset pipeline exists for this project
         yet (CFB_top25's is a separate, manually-triggered fetch-team-logos.mjs script). -->
    <script type="module" crossorigin src="/Seahawks_HQ/assets/index-DRasmtSK.js"></script>
    <link rel="stylesheet" crossorigin href="/Seahawks_HQ/assets/index-BcJLQJnZ.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages has no server-side routing, so a direct hit or hard refresh on a
         client-side route 404s -- public/404.html redirects here with the real path encoded in
         the query string; this reverses that encoding via history.replaceState before React
         Router reads the URL. See rafgraph/spa-github-pages (same pattern as CFB_top25). -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </body>
</html>
