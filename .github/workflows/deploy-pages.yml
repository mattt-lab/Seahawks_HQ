name: Deploy to GitHub Pages

# Builds dist/ and pushes it to the gh-pages branch, which Pages (set to "Deploy from a branch"
# in repo settings) serves from. After this workflow's first run creates the gh-pages branch, set
# Settings -> Pages -> Branch to gh-pages / (root). Same pattern as CFB_top25.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
