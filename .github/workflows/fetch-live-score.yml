name: Fetch live score

# Frequent, lightweight companion to fetch-data.yml -- patches live/final score, status, period,
# clock, and win probability between the heavy pipeline's once-daily runs. One summary?event= call
# per tick (single-team app, one game to check -- unlike CFB HQ's whole-slate /scoreboard).

# Cadence: every 15 minutes, every day EXCEPT Tuesday/Wednesday -- not narrow hour-of-day windows.
# An earlier version tried to predict specific US-primetime hour windows (Thu/Sun/Mon only) and
# broke for real: SEA's actual Week 1 game kicked off at 00:20 UTC Thursday (8:20pm ET WEDNESDAY),
# a genuine gap in that design (confirmed live 2026-09-10: this workflow never ran at all for that
# entire game, and the site sat on a stale pregame preview for hours after final). Fixed by
# dropping hour-of-day prediction entirely -- fetch-live-score.mjs's own early-exit guards
# (state === "pre", already-final) mean a tick outside an actual game costs one cheap ESPN call
# that returns instantly, and GH Actions minutes are unlimited for this public repo regardless of
# run count, so there's no cost to running all day.
#
# The Tuesday/Wednesday exclusion below is a DIFFERENT, narrower kind of guess than that earlier
# broken one -- it excludes specific DAYS based on the user's own confirmation that the Seahawks'
# remaining 2026 schedule has no Tuesday/Wednesday games (the Week 1 Wednesday opener was a one-off
# for that week specifically, not a recurring slot), not a guess at which HOURS within a day might
# have a game. If the schedule changes (a flexed or rescheduled game), this exclusion needs
# revisiting -- unlike the hour-of-day case, there's no cheap self-guard that makes a wrong day
# assumption free the way the always-on design did.
on:
  schedule:
    - cron: '*/15 * * * 0,1,4,5,6' # every day except Tue(2)/Wed(3)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-live-score
  cancel-in-progress: true

jobs:
  live-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check summary and patch live/final state
        run: node scripts/fetch-live-score.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current.json
          if git diff --cached --quiet; then
            echo "No data changes -- skipping commit."
          else
            git commit -m "Live score update ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
