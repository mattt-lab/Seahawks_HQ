name: Fetch live score

# Frequent, lightweight companion to fetch-data.yml -- patches live/final score, status, period,
# clock, and win probability between the heavy pipeline's once-daily runs. One summary?event= call
# per tick (single-team app, one game to check -- unlike CFB HQ's whole-slate /scoreboard).

# Cadence: 15-minute polling across Thursday Night Football, the full Sunday slate, and Monday
# Night Football -- windows padded generously rather than precisely tracking US DST (EDT vs EST
# shifts mid-season), same approach as CFB HQ's fetch-live-scores.yml. Each window is split across
# two cron lines because a US-evening window straddles the UTC calendar-day boundary. Does NOT
# cover: occasional Saturday games (mostly Week 15+) or Friday international games -- those still
# get final-score coverage from the next scheduled fetch-data.yml run, just not live in-game
# tracking. Revisit if that gap matters more than the added cost once real usage is measured.
on:
  schedule:
    - cron: '*/15 23 * * 4'    # Thursday Night Football (late UTC Thu)
    - cron: '*/15 0-4 * * 5'   # TNF continued (early UTC Fri)
    - cron: '*/15 15-23 * * 0' # Sunday slate (~11am ET onward)
    - cron: '*/15 0-4 * * 1'   # Sunday Night Football continued (early UTC Mon)
    - cron: '*/15 23 * * 1'    # Monday Night Football (late UTC Mon)
    - cron: '*/15 0-4 * * 2'   # MNF continued (early UTC Tue)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-live-score
  cancel-in-progress: true

jobs:
  live-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check summary and patch live/final state
        run: node scripts/fetch-live-score.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current.json
          if git diff --cached --quiet; then
            echo "No data changes -- skipping commit."
          else
            git commit -m "Live score update ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
