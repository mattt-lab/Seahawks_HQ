name: Fetch live score

# Frequent, lightweight companion to fetch-data.yml -- patches live/final score, status, period,
# clock, and win probability between the heavy pipeline's once-daily runs. One summary?event= call
# per tick (single-team app, one game to check -- unlike CFB HQ's whole-slate /scoreboard).

# Cadence: every 15 minutes, EVERY day, all day -- not narrow day-of-week/hour windows. That
# narrower design (Thu/Sun/Mon US-primetime windows only) shipped first and broke for real: SEA's
# actual Week 1 game kicked off at 00:20 UTC Thursday (8:20pm ET WEDNESDAY), which is a genuine gap
# in that window design (Wednesday-evening spillover into Thursday's own 00:00-04:59 UTC was never
# covered -- only Thursday-evening-into-Friday was). Confirmed live 2026-09-10: this workflow
# simply never ran for that entire game, and the site sat on a stale pregame preview for hours
# after final. Rather than patch one more hole (the next one is Saturday games, or an
# International Series game in an unanticipated timezone), this now runs unconditionally --
# fetch-live-score.mjs's own early-exit guards (state === "pre", already-final) mean every tick
# outside an actual game costs one cheap ESPN call that returns instantly, and GH Actions minutes
# are unlimited for a public repo regardless of run count, so there's no real cost to eliminating
# the whole class of "we didn't anticipate this game's time slot" bugs this way.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-live-score
  cancel-in-progress: true

jobs:
  live-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check summary and patch live/final state
        run: node scripts/fetch-live-score.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current.json
          if git diff --cached --quiet; then
            echo "No data changes -- skipping commit."
          else
            git commit -m "Live score update ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
