<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Seahawks HQ</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect (https://github.com/rafgraph/spa-github-pages) -- same pattern
      // as CFB_top25's public/404.html.
      var pathSegmentsToKeep = 1; // keep "/Seahawks_HQ" -- the project-page base path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
